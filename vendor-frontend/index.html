<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/offo-favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OFFO Vendor Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Poppins', 'sans-serif'],
            },
            colors: {
              'offo-tan': '#D9A97E',
              'offo-tan-light': '#F1F5F9',
              'offo-red': '#DC2626',
              'offo-orange': '#F97316',
              'offo-orange-dark': '#EA580C',
              'offo-green': '#16A34A',
              'dark-navy': '#1E293B',
              'slate-blue': '#334155',
              'light-gray': '#F1F5F9',
              'medium-gray': '#E2E8F0',
              'text-primary': '#0F172A',
              'text-secondary': '#475569',
            },
            keyframes: {
              fadeIn: {
                '0%': { opacity: '0', transform: 'translateY(-10px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
              popIn: {
                '0%': { opacity: '0', transform: 'translateY(20px) scale(0.8)' },
                '100%': { opacity: '1', transform: 'translateY(0) scale(1)' },
              }
            },
            animation: {
              fadeIn: 'fadeIn 0.3s ease-out forwards',
              popIn: 'popIn 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards',
            },
          },
        },
      }
    </script>
  <script type="importmap">
{
  "imports": {
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "@google/genai": "https://aistudiocdn.com/@google/genai/dist/index.js"
  }
}
</script>
</head>
  <body class="bg-offo-tan-light">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
