
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/offo-favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>OFFO - Order Food From Office</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      :root {
        --app-bg: #F8FAFC;
        --accent: #F97316;
      }
      
      body {
        margin: 0;
        padding: 0;
        background-color: var(--app-bg);
        font-family: 'Inter', sans-serif;
        overscroll-behavior-y: contain;
        -webkit-tap-highlight-color: transparent;
      }

      #root {
        height: 100vh;
        width: 100vw;
        overflow: hidden;
      }
      
      .no-scrollbar::-webkit-scrollbar {
          display: none;
      }
      .no-scrollbar {
          -ms-overflow-style: none;
          scrollbar-width: none;
      }

      /* Transitions */
      .fade-enter { opacity: 0; transform: translateY(10px); }
      .fade-enter-active { opacity: 1; transform: translateY(0); transition: all 300ms ease-out; }

      @keyframes slide-up {
        from { transform: translateY(100%); opacity: 0; }
        to { transform: translateY(0); opacity: 1; }
      }
      .animate-slide-up {
        animation: slide-up 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      @keyframes slide-out {
        to { transform: translateX(-100%); opacity: 0; }
      }
      .animate-slide-out {
        animation: slide-out 0.5s ease-in forwards;
      }

      @keyframes bounce-qty {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.15); }
      }
      .animate-bounce-qty {
        animation: bounce-qty 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      }

      @keyframes fade-in {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      .animate-fade-in {
        animation: fade-in 0.6s ease-out;
      }
      
      /* Marquee cues with paper texture overlay feel */
      .marquee::before,
      .marquee::after {
        content: '';
        position: absolute;
        top: 0;
        bottom: 0;
        width: 3rem;
        z-index: 2;
        pointer-events: none;
      }
      .marquee::before {
        left: 0;
        background: linear-gradient(to right, white, transparent);
      }
      .marquee::after {
        right: 0;
        background: linear-gradient(to left, white, transparent);
      }
    </style>
  
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
